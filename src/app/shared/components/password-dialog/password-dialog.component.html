<h2 mat-dialog-title>{{ data?.title || 'Área protegida' }}</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Senha</mat-label>
    <input
      matInput
      type="password"
      autocomplete="current-password"
      [formControl]="passwordControl"
      (keyup.enter)="submit()"
    />
  </mat-form-field>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Cancelar</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="passwordControl.invalid || isSubmitting()"
    (click)="submit()"
  >
    Entrar
  </button>
</mat-dialog-actions>
